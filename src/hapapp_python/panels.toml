# Default MADC species panels.
#
# Paths are resolved relative to the HapApp-online project root unless absolute.
# The bundled demo panel is intentionally small and is meant for app testing and
# Docker demonstrations with the example raw MADC fixture in:
# vendor/HapApp_utils/data/demo_panel/demo_raw_MADC.csv

[panels.demo]
label = "Demo panel (bundled example)"
snpid_lut = "vendor/HapApp_utils/data/demo_panel/demo_snpID_lut.csv"
allele_db_base = "vendor/HapApp_utils/data/demo_panel/demo_allele_db_v001.fa"
matchcnt_lut_base = "vendor/HapApp_utils/data/demo_panel/demo_allele_db_v001_matchCnt_lut.txt"
first_sample_col = 17
design_len = 59
seq_len = 59
cov = 90
iden = 85
code_ver = "v1"


[panels.alfalfa]
label = "Alfalfa 3k DArTag (v1.0)"
snpid_lut = "${HAPAPP_TEST_ALFALFA_PANEL_REPO}/blob/main/data/f180bp/20201030-BI-Alfalfa_SNPs_DArTag-probe-design_snpID_lut.csv"
allele_db_base = "${HAPAPP_TEST_ALFALFA_PANEL_REPO}/tree/main/data/versions" #This should use the highest version available.
matchcnt_lut_base = "${HAPAPP_TEST_ALFALFA_PANEL_REPO}/tree/main/data/versions" #This should use the matching version of the allele_db base
first_sample_col = 17
design_len = 54
seq_len = 81
cov = 90
iden = 85
code_ver = "v1"
