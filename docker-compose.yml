services:
  hapapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_PLATFORM: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${HAPAPP_IMAGE:-hapapp-online}:${HAPAPP_TAG:-local}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; from hapapp_python.env import load_env; load_env(); from hapapp_python import config; scheme = 'https' if config.SSL_CONTEXT else 'http'; context = ssl._create_unverified_context() if config.SSL_CONTEXT else None; urllib.request.urlopen(f'{scheme}://127.0.0.1:{config.APP_PORT}/', context=context, timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
