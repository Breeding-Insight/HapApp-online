[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hapapp-online"
version = "0.1.0"
description = "Dash interface for HapApp microhaplotype assignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "biopython",
  "cutadapt",
  "dash",
  "dash-bootstrap-components",
  "dash-iconify",
  "dash-uploader>=0.6.1,<0.7",
  "pandas",
  "pyodbc",
  "python-dotenv",
  "requests",
]

[project.scripts]
hapapp-online = "hapapp_python.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hapapp_python = ["py.typed", "panels.toml"]
