name: Build & Push Docker image on release

on:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/breedinginsight/hapapp
  IMAGE_DEPS: docker.io/breedinginsight/hapapp-deps
  DEPS_TAG: r4.5-bioc3.21-2025-08

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: ver
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.release.tag_name }}"
          tag_ver="${tag#v}"

          pyproject_ver=$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          p = Path("pyproject.toml")
          if not p.exists():
              raise SystemExit("pyproject.toml not found")

          data = tomllib.loads(p.read_text())
          version = data.get("project", {}).get("version", "")

          if not version:
              raise SystemExit("No [project].version found in pyproject.toml")

          print(version)
          PY
          )

          if [[ "$tag_ver" != "$pyproject_ver" ]]; then
            echo "Release tag '$tag' does not match pyproject.toml version '$pyproject_ver'." >&2
            echo "Expected release tag: v$pyproject_ver" >&2
            exit 1
          fi

          echo "version=${pyproject_ver}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=v${{ needs.check-version.outputs.version }}-amd64
            type=raw,value=sha-${{ github.sha }}-amd64

      - name: Build & push app amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_DEPS }}:${{ env.DEPS_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64,mode=max,compression=zstd

  build-arm64:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=v${{ needs.check-version.outputs.version }}-arm64
            type=raw,value=sha-${{ github.sha }}-arm64

      - name: Build & push app arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_DEPS }}:${{ env.DEPS_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max,compression=zstd

  manifest:
    needs: [check-version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE }}
          PKG_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "$IMAGE:v${PKG_VERSION}" \
            -t "$IMAGE:latest" \
            "$IMAGE:v${PKG_VERSION}-amd64" \
            "$IMAGE:v${PKG_VERSION}-arm64"
